version: "3.8"

services:
  # ── Base de données PostgreSQL ──────────────────────────
  db:
    image: postgres:15
    container_name: fintrack_db
    restart: always
    environment:
      POSTGRES_DB: fintrack_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: etudiante
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fintrack_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Flask + Gunicorn ────────────────────────────
  backend:
    build: ./backend
    container_name: fintrack_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:etudiante@db/fintrack_db
      JWT_SECRET_KEY: fintrack-secret-2026
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fintrack_network

  # ── Frontend React + Nginx ──────────────────────────────
  frontend:
    build: ./frontend
    container_name: fintrack_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - fintrack_network

  # ── Monitoring — Prometheus ──────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: fintrack_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - fintrack_network

  # ── Monitoring — Grafana ─────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: fintrack_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: fintrack2026
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - fintrack_network

  # ── cAdvisor (métriques conteneurs) ─────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: fintrack_cadvisor
    restart: always
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - fintrack_network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  fintrack_network:
    driver: bridge
